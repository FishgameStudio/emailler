[package]
name = "emailler"
version = "0.1.0"
edition = "2024"
description = "Get started to use send emails with emailler."
license = "MIT"
repo = "https://github.com/FishgameStudio/emailler"

[lib]
name = "emailler"

[dependencies]
imap = { version = "2.4.1", features = ["native-tls"] }
lettre = "0.11.23"
mail-parser = "0.11.9"
native-tls = "0.2.18"
thiserror = "2.0.21"
zeroize = "1.9.0"
